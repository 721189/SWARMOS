name: SWARMOS CI & Scientific Verification Pipeline

on:
  push:
    branches: [ "main", "research-hardening" ]
  pull_request:
    branches: [ "main", "research-hardening" ]

jobs:
  python-simulation-core:
    name: Python Simulation & Scientific Invariant Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f swarmos/requirements.txt ]; then pip install -r swarmos/requirements.txt; fi

    - name: Validate Core Syntax
      run: |
        python3 -m compileall swarmos/

    - name: Execute Simulation & Scientific Invariant Tests
      run: |
        PYTHONPATH=. python3 -m unittest discover -s swarmos/tests -p "test_*.py" -v

    - name: Execute Reduced Matrix Benchmark
      run: |
        PYTHONPATH=. python3 swarmos/research/reproduce.py --reduced

    - name: Audit Scientific Claims & Story Invariants
      run: |
        PYTHONPATH=. python3 swarmos/paper/verify_claims.py

    - name: Execute Scalability & Sensitivity Smoke Tests
      run: |
        PYTHONPATH=. python3 swarmos/research/scalability.py
        PYTHONPATH=. python3 swarmos/research/sensitivity.py

  typescript-frontend:
    name: Node.js Frontend & API
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"

    - name: Install Dependencies
      run: npm ci

    - name: TypeScript Static Analysis (Lint)
      run: npm run lint

    - name: Production Build (Vite + esbuild)
      run: npm run build
