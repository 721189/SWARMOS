<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="100%" height="100%" style="background:#0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="nvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76b900" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowSky" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#76b900" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="700" y="55" fill="#38bdf8" font-size="28" font-weight="bold" text-anchor="middle" letter-spacing="1">SWARMOS ARCHITECTURE &amp; DATAFLOW PIPELINE</text>
  <text x="700" y="85" fill="#94a3b8" font-size="14" text-anchor="middle">Decentralized Multi-Agent CBBA Engine with NVIDIA Nemotron &amp; Nebius AI Cloud Infrastructure</text>

  <!-- Top Level: Commander & AI Parser -->
  <!-- 1. Commander Input Box -->
  <rect x="60" y="130" width="340" height="130" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <text x="230" y="165" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle">COMMANDER / TACTICAL EDGE</text>
  <text x="230" y="195" fill="#cbd5e1" font-size="13" text-anchor="middle">Natural Language Operational Directive</text>
  <text x="230" y="220" fill="#94a3b8" font-size="11" font-style="italic" text-anchor="middle">"Sweep sector alpha, rescue casualties, disrupt EW jammer"</text>

  <!-- Arrow Commander to LLM -->
  <path d="M400 195 L520 195" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowSky)" />

  <!-- 2. NVIDIA Nemotron AI Layer -->
  <rect x="530" y="115" width="400" height="160" rx="10" fill="#1e293b" stroke="#76b900" stroke-width="2.5" filter="url(#glow)" />
  <rect x="530" y="115" width="400" height="36" rx="10" fill="url(#nvGrad)" />
  <text x="730" y="140" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">NVIDIA NEMOTRON-4-340B (NEBIUS CLOUD)</text>
  <text x="730" y="180" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Multi-Domain Tactical Intent Parser</text>
  <text x="730" y="208" fill="#cbd5e1" font-size="12" text-anchor="middle">• Semantic Role Labeling &amp; Task Discretization</text>
  <text x="730" y="232" fill="#cbd5e1" font-size="12" text-anchor="middle">• Spatial Waypoint Mapping &amp; Urgency Weighting (λ)</text>
  <text x="730" y="256" fill="#a3e635" font-size="11" font-family="monospace" text-anchor="middle">Structured Output: JSON Task Manifest [RECON, RESCUE, ...]</text>

  <!-- Arrow LLM to Swarm Orchestrator -->
  <path d="M730 275 L730 350" stroke="#76b900" stroke-width="2.5" marker-end="url(#arrowGreen)" />
  <text x="745" y="320" fill="#76b900" font-size="12" font-weight="bold">JSON Tasks Manifest</text>

  <!-- 3. Central Layer: Swarm Orchestrator -->
  <rect x="420" y="360" width="580" height="160" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
  <rect x="420" y="360" width="580" height="36" rx="12" fill="url(#amberGrad)" />
  <text x="710" y="385" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="middle">SWARM ORCHESTRATOR &amp; EXECUTIVE PIPELINE</text>
  <g transform="translate(440, 410)">
    <rect x="0" y="10" width="165" height="85" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="82" y="35" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle">Dynamic Replanner</text>
    <text x="82" y="55" fill="#94a3b8" font-size="11" text-anchor="middle">Orphan detection</text>
    <text x="82" y="72" fill="#94a3b8" font-size="11" text-anchor="middle">Autonomous rebidding</text>

    <rect x="180" y="10" width="170" height="85" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="265" y="35" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Metrics Tracker</text>
    <text x="265" y="55" fill="#94a3b8" font-size="11" text-anchor="middle">Convergence latency</text>
    <text x="265" y="72" fill="#94a3b8" font-size="11" text-anchor="middle">Mesh packet volume</text>

    <rect x="365" y="10" width="165" height="85" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="447" y="35" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle">Explainable Swarm</text>
    <text x="447" y="55" fill="#94a3b8" font-size="11" text-anchor="middle">X-AI Forensic Logs</text>
    <text x="447" y="72" fill="#94a3b8" font-size="11" text-anchor="middle">Bid matrix comparison</text>
  </g>

  <!-- Left: Explainability X-AI Popout -->
  <rect x="60" y="360" width="310" height="160" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2" />
  <text x="215" y="390" fill="#c084fc" font-size="15" font-weight="bold" text-anchor="middle">EXPLAINABLE AI (X-SWARM)</text>
  <text x="215" y="420" fill="#cbd5e1" font-size="12" text-anchor="middle">Forensic Consensus Justification</text>
  <text x="215" y="445" fill="#94a3b8" font-size="11" text-anchor="middle">• Marginal Utility Delta: cij = R * λ^(t*ω)</text>
  <text x="215" y="468" fill="#94a3b8" font-size="11" text-anchor="middle">• Proximity &amp; Path Insertion Cost Audit</text>
  <text x="215" y="492" fill="#94a3b8" font-size="11" text-anchor="middle">• Transparent Competing Bid Vectors</text>
  <path d="M420 440 L370 440" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Right: Failure Injector -->
  <rect x="1030" y="360" width="310" height="160" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
  <text x="1185" y="390" fill="#f87171" font-size="15" font-weight="bold" text-anchor="middle">DYNAMIC FAILURE INJECTOR</text>
  <text x="1185" y="420" fill="#cbd5e1" font-size="12" text-anchor="middle">Contested Operational Stress Testing</text>
  <text x="1185" y="445" fill="#94a3b8" font-size="11" text-anchor="middle">• Motor Failure (Kinetic Agent Kill)</text>
  <text x="1185" y="468" fill="#94a3b8" font-size="11" text-anchor="middle">• RF Electronic Warfare Jammer Bubbles</text>
  <text x="1185" y="492" fill="#94a3b8" font-size="11" text-anchor="middle">• Pop-Up SAM Radar Hostile Zones</text>
  <path d="M1030 440 L1000 440" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowRed)" />

  <!-- Arrow Orchestrator to Physical Swarm Mesh -->
  <path d="M710 520 L710 590" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowSky)" />
  <text x="725" y="560" fill="#38bdf8" font-size="13" font-weight="bold">CBBA Auction Cycles &amp; Telemetry Sync</text>

  <!-- Bottom: Physical Decentralized Mesh (CBBA Layer) -->
  <rect x="60" y="600" width="1280" height="260" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" />
  <text x="700" y="635" fill="#38bdf8" font-size="17" font-weight="bold" text-anchor="middle">DECENTRALIZED AD-HOC WIRELESS MESH &amp; CBBA EXECUTION LAYER</text>
  <text x="700" y="658" fill="#94a3b8" font-size="12" text-anchor="middle">Peer-to-Peer 1-Hop Wireless Links • No Central Coordinator • 11-Rule Conflict Resolution</text>

  <!-- Agents -->
  <!-- Agent 1 (Failed/Red) -->
  <g transform="translate(100, 680)">
    <rect x="0" y="0" width="190" height="150" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
    <circle cx="95" cy="40" r="20" fill="#ef4444" opacity="0.2" />
    <circle cx="95" cy="40" r="12" fill="#ef4444" />
    <text x="95" y="75" fill="#f87171" font-size="13" font-weight="bold" text-anchor="middle">DRONE A1 [FAILED]</text>
    <text x="95" y="98" fill="#94a3b8" font-size="11" text-anchor="middle">Motor Shaft Fracture</text>
    <text x="95" y="118" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle">Tasks Released &amp; Rebidded</text>
    <text x="95" y="136" fill="#64748b" font-size="10" text-anchor="middle">Battery: 0% | Link: DOWN</text>
  </g>

  <!-- Agent 2 (Active/Green) -->
  <g transform="translate(340, 680)">
    <rect x="0" y="0" width="190" height="150" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2" />
    <circle cx="95" cy="40" r="20" fill="#22c55e" opacity="0.2" />
    <circle cx="95" cy="40" r="12" fill="#22c55e" />
    <text x="95" y="75" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle">DRONE A2 [EXECUTING]</text>
    <text x="95" y="98" fill="#f1f5f9" font-size="11" text-anchor="middle">Bundle: [T1:RECON, T2:RESCUE]</text>
    <text x="95" y="118" fill="#94a3b8" font-size="11" text-anchor="middle">Path: A2 -> T1 -> T2</text>
    <text x="95" y="136" fill="#4ade80" font-size="10" text-anchor="middle">Battery: 92% | Speed: 65m/s</text>
  </g>

  <!-- Agent 3 (Active/Cyan) -->
  <g transform="translate(580, 680)">
    <rect x="0" y="0" width="190" height="150" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <circle cx="95" cy="40" r="20" fill="#38bdf8" opacity="0.2" />
    <circle cx="95" cy="40" r="12" fill="#38bdf8" />
    <text x="95" y="75" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">DRONE A3 [TRAVERSING]</text>
    <text x="95" y="98" fill="#f1f5f9" font-size="11" text-anchor="middle">Bundle: [T3:NEUTRALIZE]</text>
    <text x="95" y="118" fill="#94a3b8" font-size="11" text-anchor="middle">Highest Bidder (142.5 pts)</text>
    <text x="95" y="136" fill="#38bdf8" font-size="10" text-anchor="middle">Battery: 88% | EW Safe Corridors</text>
  </g>

  <!-- Agent 4 (Active/Purple Jammed/Recovering) -->
  <g transform="translate(820, 680)">
    <rect x="0" y="0" width="190" height="150" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2" />
    <circle cx="95" cy="40" r="20" fill="#a855f7" opacity="0.2" />
    <circle cx="95" cy="40" r="12" fill="#a855f7" />
    <text x="95" y="75" fill="#c084fc" font-size="13" font-weight="bold" text-anchor="middle">DRONE A4 [RELAY]</text>
    <text x="95" y="98" fill="#f1f5f9" font-size="11" text-anchor="middle">EW Jammer Edge Relay</text>
    <text x="95" y="118" fill="#94a3b8" font-size="11" text-anchor="middle">Bridge Comm Link</text>
    <text x="95" y="136" fill="#c084fc" font-size="10" text-anchor="middle">Battery: 85% | RF Attenuated</text>
  </g>

  <!-- Agent 5 (Active/Yellow Bidding) -->
  <g transform="translate(1060, 680)">
    <rect x="0" y="0" width="190" height="150" rx="8" fill="#1e293b" stroke="#facc15" stroke-width="2" />
    <circle cx="95" cy="40" r="20" fill="#facc15" opacity="0.2" />
    <circle cx="95" cy="40" r="12" fill="#facc15" />
    <text x="95" y="75" fill="#facc15" font-size="13" font-weight="bold" text-anchor="middle">DRONE A5 [SURVEIL]</text>
    <text x="95" y="98" fill="#f1f5f9" font-size="11" text-anchor="middle">Bundle: [T4:SURVEIL, T5:RELAY]</text>
    <text x="95" y="118" fill="#94a3b8" font-size="11" text-anchor="middle">Consensus Reached in 18ms</text>
    <text x="95" y="136" fill="#facc15" font-size="10" text-anchor="middle">Battery: 95% | Sensor 100%</text>
  </g>

  <!-- Mesh Connections Between Agents -->
  <path d="M530 755 L580 755" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />
  <path d="M770 755 L820 755" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />
  <path d="M1010 755 L1060 755" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />
  <!-- Broken link from A1 to A2 -->
  <path d="M290 755 L340 755" stroke="#ef4444" stroke-width="2" stroke-dasharray="2,4" />
  <text x="315" y="748" fill="#ef4444" font-size="10" text-anchor="middle">FAULT</text>
</svg>
